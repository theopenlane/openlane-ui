version: '3'

env:
  ENV: config

dotenv: ['.env', '{{.ENV}}/.env']

includes:
  codegen:
    taskfile: ./packages/codegen/Taskfile.yaml
    dir: ./packages/codegen

tasks:
  default:
    silent: true
    cmds:
      - task --list

  local-setup:
    desc: Setup the project dependencies
    cmds:
      - task: install-bun
      - bun install

  install-bun:
    desc: install bun package manager
    cmd: curl -fsSL https://bun.sh/install | bash

  build:
    desc: build all apps and package
    cmd: bun run build

  build:dev:
    dir: apps/console
    desc: build console in dev mode with debug info
    cmd: bun run debug

  install:
    desc: install the dependencies listed in package.json
    cmds:
      - bun install

  reinstall:
    desc: reinstall the dependencies listed in package.json
    cmds:
      - task: clean
      - bun install --dev turbo@latest
      - bun run turbo-clean
      - task: install

  test:
    desc: run all tests
    cmds:
      - bun run test

  clean:
    desc: clean all apps and package
    cmd: bun run clean

  dev:
    desc: develop all apps
    cmds:
      - task: install
      - bun dev

  dev:console:
    desc: develop console
    cmds:
      - task: install
      - bun dev --filter={apps/console}

  dev:storybook:
    desc: develop storybook
    cmds:
      - task: install
      - bun dev --filter={apps/storybook}

  e2e:
    dir: apps/console
    desc: run the console e2e suite against whatever is already serving on :3001
    cmd: bun run e2e {{.CLI_ARGS}}

  e2e:full:
    dir: apps/console
    desc: build the console, serve it on :3004, run the whole e2e suite, tear down
    cmd: bun run e2e:full {{.CLI_ARGS}}

  e2e:segment:
    dir: apps/console
    desc: 'run one e2e segment, e.g. task e2e:segment -- controls'
    cmd: bun run e2e:segment {{.CLI_ARGS}}

  e2e:sharded:
    dir: apps/console
    desc: run the e2e suite in shards, restarting the server between them
    cmd: bun run e2e:sharded {{.CLI_ARGS}}

  e2e:ui:
    dir: apps/console
    desc: run the e2e suite in Playwright's interactive UI mode
    cmd: bun run e2e:ui {{.CLI_ARGS}}

  e2e:headed:
    dir: apps/console
    desc: run the e2e suite in a visible browser
    cmd: bun run e2e:headed {{.CLI_ARGS}}

  e2e:report:
    dir: apps/console
    desc: open the HTML report from the last e2e run
    cmd: bun run e2e:report

  e2e:typecheck:
    dir: apps/console
    desc: type-check the e2e suite without running it
    cmd: bun run e2e:typecheck

  lint:
    desc: Run ESLint on the console app
    cmds:
      - npx eslint --config apps/console/eslint.config.js --max-warnings=0 {{.CLI_ARGS | default "apps/console/src"}} --fix

  precommit-full:
    desc: Run lint-staged and tests against all files
    cmds:
      - bunx lint-staged
      - bun test

  update:passkeys:
    desc: Update the known passkey aaguids. This should be run periodically
    cmds:
      - curl https://raw.githubusercontent.com/passkeydeveloper/passkey-authenticator-aaguids/refs/heads/main/aaguid.json -o apps/console/src/lib/passkeys.json

  generate:routes:
    desc: Generate static route list from app folders
    cmds:
      - bun tsc --project apps/console/scripts/tsconfig.routes.json
      - bun run apps/console/scripts/generateRoutes.js

  update:routes:
    desc: Generate static route list from app folders
    cmds:
      - bun tsc --project apps/console/scripts/tsconfig.routes.json
      - bun run apps/console/scripts/updateRoutes.js
