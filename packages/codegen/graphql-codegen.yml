config:
  strict: true
  useTypeImports: true
  exposeDocument: true # For each generate query hook adds document field with a corresponding GraphQL query. Useful for queryClient.fetchQuery
  exposeQueryKeys: true # For each generate query hook adds getKey(variables: QueryVariables) function. Useful for cache updates. If addInfiniteQuery is true, it will also add a getKey function to each infinite query
  addInfiniteQuery: true
  exposeMutationKeys: true # For each generate mutation hook adds getKey() function. Useful for call outside of functional component
  exposeFetcher: true # For each generate query hook adds fetcher field with a corresponding GraphQL query using the fetcher. It is useful for queryClient.fetchQuery and queryClient.prefetchQuery
  optimizeDocumentNode: true
  maybeValue: T | null
  declarationKind: interface
  onlyOperationTypes: false
  flattenGeneratedTypes: false
  defaultScalarType: any
  namingConvention:
    enumValues: keep
  scalars:
    DateTime: string
    Date: string
    Decimal: number
    UUID: string
    ID: string
    JSON: any
    Upload: any
overwrite: true
schema: https://raw.githubusercontent.com/theopenlane/core/main/internal/graphapi/clientschema/schema.graphql
# schema: ../../../core-more/internal/graphapi/clientschema/schema.graphql
documents: './query/**/*.ts'
generates:
  ./src/introspectionschema.json:
    plugins:
      - introspection
    config:
  # the raw sdl is emitted because introspection drops directives applied to types,
  # and the @modules directives are what drive the object module map
  ./src/schema.graphql:
    plugins:
      - schema-ast
  ./src/schema-types.ts:
    plugins:
      - typescript # Base TypeScript types (object types, inputs, native enums) from the GraphQL schema
      - add:
          content: '/* eslint-disable */'
  ./src/schema.ts:
    plugins:
      - typescript-operations # Operation types (Query/Mutation/Fragment results and variables); base types are imported, not re-emitted
      - add:
          content: '/* eslint-disable */'
      - add:
          content: "export * from './schema-types'"
    config:
      importSchemaTypesFrom: './src/schema-types'
  ./src/historyschema-types.ts:
    schema: https://raw.githubusercontent.com/theopenlane/core/main/internal/graphapi/historyschema/schema.graphql
    documents: './query-history/**/*.ts'
    plugins:
      - typescript
      - add:
          content: '/* eslint-disable */'
  ./src/historyschema.ts:
    schema: https://raw.githubusercontent.com/theopenlane/core/main/internal/graphapi/historyschema/schema.graphql
    documents: './query-history/**/*.ts'
    plugins:
      - typescript-operations
      - add:
          content: '/* eslint-disable */'
      - add:
          content: "export * from './historyschema-types'"
    config:
      importSchemaTypesFrom: './src/historyschema-types'
hooks:
  afterAllFileWrite:
    - node ./plugins/generate-type-constants.js
    - node ./plugins/generate-object-modules.js
    - node ./plugins/generate-queries.js
    - node ./plugins/generate-hooks.js
    - node ./plugins/generate-merge-fields.js
