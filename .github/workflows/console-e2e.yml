name: Console E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: console-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    env:
      E2E_PORT: '3001'
      E2E_BASE_URL: http://localhost:3001
      E2E_API_BASE: http://localhost:17608
      E2E_WORKERS: '4'
      E2E_RUN_ID: s${{ matrix.shardIndex }}r${{ github.run_id }}
      COOKIE_PLAYWRIGHT_INSECURE: 'true'
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: theopenlane/core
          path: core
          ref: main

      - name: Start core stack
        working-directory: core
        run: |
          cp config/config-dev.example.yaml config/.config.yaml
          docker compose \
            -f ./docker/docker-compose-redis.yml \
            -f ./docker/docker-compose-fga.yml \
            -f ./docker/docker-compose-riverboat.yml \
            -f ./docker/docker-compose-published.yml \
            up -d

      - name: Wait for core
        run: |
          for _ in $(seq 1 60); do
            if curl -sf --max-time 5 http://localhost:17608/livez >/dev/null; then
              echo "core is up"
              exit 0
            fi
            sleep 5
          done
          echo "core did not become healthy on :17608" >&2
          exit 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Write console env
        run: |
          sed \
            -e "s|^AUTH_SECRET=.*|AUTH_SECRET=$(openssl rand -base64 32)|" \
            -e "s|^NEXTAUTH_SECRET=.*|NEXTAUTH_SECRET=$(openssl rand -base64 32)|" \
            config/.env.example > apps/console/.env

      - name: Install Playwright browsers
        working-directory: apps/console
        run: bunx playwright install --with-deps chromium

      - name: Build console
        working-directory: apps/console
        run: bun run build

      - name: Run shard
        working-directory: apps/console
        env:
          E2E_SKIP_BUILD: '1'
        run: bun run e2e:full -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: apps/console/e2e/blob-report
          retention-days: 1

      - name: Core logs on failure
        if: failure()
        working-directory: core
        run: docker compose -f ./docker/docker-compose-published.yml logs --tail=500

  merge-reports:
    name: merge reports
    if: ${{ !cancelled() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v5
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML report
        run: bunx playwright merge-reports --reporter html,github ./all-blob-reports

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: html-report--attempt-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 14
