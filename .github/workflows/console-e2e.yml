name: Console E2E

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

concurrency:
  group: console-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright suite against core
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_PORT: '3001'
      E2E_BASE_URL: http://localhost:3001
      E2E_API_BASE: http://localhost:17608
      COOKIE_PLAYWRIGHT_INSECURE: 'true'
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: theopenlane/core
          path: core
          ref: main

      - name: Start core stack
        working-directory: core
        run: |
          cp config/config-dev.example.yaml config/.config.yaml
          docker compose \
            -f ./docker/docker-compose-redis.yml \
            -f ./docker/docker-compose-fga.yml \
            -f ./docker/docker-compose-riverboat.yml \
            -f ./docker/docker-compose-published.yml \
            up -d

      - name: Wait for core
        run: |
          for _ in $(seq 1 60); do
            if curl -sf --max-time 5 http://localhost:17608/livez >/dev/null; then
              echo "core is up"
              exit 0
            fi
            sleep 5
          done
          echo "core did not become healthy on :17608" >&2
          docker compose -f core/docker/docker-compose-published.yml logs --tail=200 >&2 || true
          exit 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Write console env
        run: |
          sed \
            -e "s|^AUTH_SECRET=.*|AUTH_SECRET=$(openssl rand -base64 32)|" \
            -e "s|^NEXTAUTH_SECRET=.*|NEXTAUTH_SECRET=$(openssl rand -base64 32)|" \
            config/.env.example > apps/console/.env

      - name: Install Playwright browsers
        working-directory: apps/console
        run: bunx playwright install --with-deps chromium

      - name: Build console
        working-directory: apps/console
        run: bun run build

      - name: Run E2E suite
        working-directory: apps/console
        env:
          E2E_SKIP_BUILD: '1'
        run: bun run e2e:full

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/console/e2e/playwright-report
          retention-days: 7

      - name: Core logs on failure
        if: failure()
        working-directory: core
        run: docker compose -f ./docker/docker-compose-published.yml logs --tail=500
