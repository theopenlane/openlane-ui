name: Console checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: console-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: type-check + unit tests + E2E compile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check console
        working-directory: apps/console
        run: npx tsc --noEmit

      - name: Unit tests
        run: bun test apps/console/src packages

      - name: Type-check E2E suite
        working-directory: apps/console
        run: npx tsc -p e2e/tsconfig.json --noEmit

      - name: Enumerate E2E specs
        working-directory: apps/console
        run: bunx playwright test --list
